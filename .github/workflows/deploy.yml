name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build site with last updated date
        run: |
          iso=$(TZ=Europe/London git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          human=$(date -d "$iso" '+%-d %B %Y')
          mkdir _site
          cp index.html styles.css script.js CNAME _site/
          sed -i \
            -e "s/__LAST_UPDATED_ISO__/$iso/" \
            -e "s/__LAST_UPDATED__/$human/" \
            -e 's/class="footer-updated" hidden/class="footer-updated"/' \
            _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
